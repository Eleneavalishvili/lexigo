<button
  type="button"
  (click)="visible.set(!visible())"
  [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
  [attr.aria-pressed]="visible()"
  [attr.aria-controls]="inputId()"
  [attr.title]="visible() ? 'A little privacy' : 'Take a little peek'"
>
  <svg viewBox="0 0 48 36" aria-hidden="true" focusable="false">
    <path class="rays" d="M24 3v4M12 6l2 4M36 6l-2 4M4 13l4 2M44 13l-4 2" />
    @if (visible()) {
      <path class="eye" d="M5 19Q24 0 43 19Q24 38 5 19Z" />
      <circle class="iris" cx="24" cy="19" r="8" />
      <path class="pupil" d="m24 12 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" />
    } @else {
      <path class="eye" d="M5 17Q24 34 43 17M10 22l-3 5M18 26l-1 6M30 26l1 6M38 22l3 5" />
      <path class="wink" d="m24 11 1.5 3.5L29 16l-3.5 1.5L24 21l-1.5-3.5L19 16l3.5-1.5Z" />
    }
  </svg>
</button>
