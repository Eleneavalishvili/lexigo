<section class="listening-card" aria-label="Lesson recording">
  <div class="listening-heading">
    <span class="eyebrow">A LITTLE LISTEN</span
    ><span>{{ audio().durationMilliseconds / 1000 }} seconds</span>
  </div>
  @if (url(); as clip) {
    <audio
      #player
      [src]="clip"
      controls
      preload="none"
      (play)="playing.set(true)"
      (pause)="playing.set(false)"
      (ended)="playing.set(false)"
      (loadedmetadata)="applySpeed()"
      (error)="playbackError()"
    >
      Your browser does not support audio playback.
    </audio>
    <label
      >Playback speed
      <select [value]="speed()" (change)="changeSpeed($event)">
        <option value="0.65">Extra slow · 0.65×</option>
        <option value="0.8">Learning pace · 0.8×</option>
        <option value="0.75">A little slower · 0.75×</option>
        <option value="1">Original pace · 1×</option>
        <option value="1.25">A little quicker · 1.25×</option>
      </select></label
    >
    <button type="button" class="close-audio" (click)="close()">Close recording</button>
  } @else {
    <button type="button" class="button button-outline" (click)="open()" [disabled]="busy()">
      {{ busy() ? 'Opening recording…' : 'Listen to recording ▷' }}
    </button>
  }
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  <details>
    <summary>Audio source & permission</summary>
    <p>{{ audio().source }}</p>
    <p>{{ audio().license }}</p>
  </details>
</section>
