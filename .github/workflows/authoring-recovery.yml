name: Authoring and recovery browser checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lexigo-authoring-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.21.0"
          package-manager-cache: false
      - name: Build API with locked packages
        run: |
          dotnet restore backend/LexiGo.slnx --locked-mode
          dotnet build backend/LanguageLearning.Api --configuration Release --no-restore
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm install --global npm@11.6.2
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify desktop and phone workflows in disposable services
        shell: pwsh
        run: ./scripts/Verify-LearnerBrowser.ps1 -Workers 1 -Spec 'account-recovery.spec.ts|course-creation.spec.ts|dialogue-authoring.spec.ts|grammar-foundations.spec.ts'
